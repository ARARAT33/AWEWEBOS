name: Build AWEWEBOS native desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'package.json'
      - 'src-tauri/**'
      - '.github/workflows/native-build.yml'
concurrency:
  group: native-build-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
          - platform: windows-latest
            artifact: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend tools
        run: npm install
      - name: Validate setup module
        run: node --check setup.js
      - name: Prepare web assets and icons
        shell: bash
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js icon.svg setup.js setup.css dist/
          npx tauri icon icon.svg
      - name: Build native app
        run: npx tauri build
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: awewebos-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
