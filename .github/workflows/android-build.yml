name: Build AWEWEBOS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'setup.js'
      - 'setup.css'
      - 'webos-fs.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'package.json'
      - 'src-tauri/**'
      - '.github/workflows/android-build.yml'
concurrency:
  group: android-build-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install frontend and Android Rust tools
        run: |
          npm install
          cargo install cargo-ndk --locked
      - name: Validate setup module
        run: node --check setup.js
          node --check webos-fs.js
      - name: Prepare web assets and icons
        shell: bash
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js icon.svg setup.js setup.css webos-fs.js dist/
          npx tauri icon icon.svg
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build Android APK
        run: npx tauri android build --apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awewebos-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
