name: AWEWEBOS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-webos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No script elements found")
          out = pathlib.Path("/tmp/awewebos-inline")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          for file in /tmp/awewebos-inline/*.js; do
            node --check "$file"
          done
      - name: Check local node backend syntax
        run: node --check backend/server.mjs && node --check backend/test.mjs
      - name: Test local publish node API and persistence
        run: node backend/test.mjs
      - name: Check patch whitespace
        run: git diff --check
