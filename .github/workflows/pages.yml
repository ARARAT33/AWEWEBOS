name: Deploy AWEWEBOS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static app
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          test -f setup.js
          test -f setup.css
          test -f webos-fs.js
          node --check setup.js
          node --check webos-fs.js
          python -c "import json; m=json.load(open('manifest.webmanifest')); assert m['name'].startswith('AWEWEBOS'); print('PWA manifest validated')"
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline app script found"
          for i, script in enumerate(scripts):
              with open(f"/tmp/awewebos-{i}.js", "w", encoding="utf-8") as f:
                  f.write(script)
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/awewebos-*.js; do node --check "$file"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
