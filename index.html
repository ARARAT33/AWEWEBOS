<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><meta name="description" content="AWEWEBOS local-first web operating environment"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>AWEWEBOS — AWE Operating Environment</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101c30;--line:#2a3d59;--text:#e9f2ff;--muted:#9aabc4;--cyan:#45d7f5;--blue:#6888ff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 20%,#18365c,transparent 38%),radial-gradient(ellipse at 20% 85%,#112c45,transparent 42%),#080d18;color:var(--text);height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{color:inherit;background:#17243a;border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--cyan)}button.primary{background:linear-gradient(135deg,#147c9a,#3d59bb)}input,textarea,select{color:var(--text);background:#08111f;border:1px solid #31445f;border-radius:10px;padding:10px;max-width:100%}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}header{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#080d18b8;border-bottom:1px solid #ffffff18;backdrop-filter:blur(18px);position:relative;z-index:5}#brand{font-weight:900;letter-spacing:1px}#brand b{color:var(--cyan)}#desktop{height:calc(100dvh - 44px);padding:18px;position:relative;background-image:linear-gradient(#5bd5ff08 1px,transparent 1px),linear-gradient(90deg,#5bd5ff08 1px,transparent 1px);background-size:38px 38px}.icons{display:grid;grid-template-columns:repeat(2,86px);gap:8px}.deskicon{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border-color:transparent;font-size:12px;height:88px}.emoji{font-size:24px;background:#1a2d48;border-radius:15px;width:46px;height:46px;display:grid;place-items:center}.hero{position:absolute;right:5%;top:13%;text-align:right;pointer-events:none}.hero h1{font-size:clamp(38px,6vw,76px);line-height:.95;letter-spacing:-4px;margin:0}.hero h1 span{color:var(--cyan)}.hero p{max-width:350px;color:#b4c6df;margin-left:auto}#dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#0a1323db;border:1px solid #ffffff24;border-radius:20px;max-width:95vw;overflow-x:auto;z-index:8;backdrop-filter:blur(20px)}#dock button{flex:0 0 46px;width:46px;height:46px;padding:0;font-size:21px;border-radius:14px}.window{position:absolute;z-index:10;left:50%;top:49%;transform:translate(-50%,-50%);width:min(840px,calc(100vw - 24px));height:min(590px,calc(100dvh - 110px));display:flex;flex-direction:column;background:#0d1728f5;border:1px solid #3b506d;border-radius:16px;box-shadow:0 25px 80px #000a;overflow:hidden}.window.max{width:calc(100vw - 16px);height:calc(100dvh - 58px)}.winhead{height:44px;flex:0 0 44px;background:#142239;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:move}.winhead button{padding:1px 8px}.winbody{padding:17px;overflow:auto;flex:1}.winbody h2{margin:0 0 8px}.winbody p{color:#b5c5da}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input,.row textarea{flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.card{background:#142239;border:1px solid #2b3e59;border-radius:13px;padding:13px}.card h3{margin:5px 0}.field{width:100%;margin:5px 0 10px}.list{display:grid;gap:7px}.item{background:#101e32;border:1px solid #263952;border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:8px}.metric{font-size:25px;font-weight:800;color:var(--cyan)}.terminal{background:#050a12;color:#a7f2d2;padding:12px;border-radius:10px;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172941;border:1px solid #45617e;border-radius:11px;padding:10px 15px;z-index:99;max-width:90vw}.goog-te-gadget{color:#9aabc4!important}.goog-te-gadget .goog-te-combo{background:#0c1728;color:#fff;border:1px solid #30435d;border-radius:8px;padding:7px}.goog-logo-link,.goog-te-gadget span{display:none!important}iframe{max-width:100%}a{color:var(--cyan)}@media(max-width:650px){.hero{display:none}#desktop{padding:12px 6px}.window{width:calc(100vw - 12px);height:calc(100dvh - 75px)}.winbody{padding:12px}.cards{grid-template-columns:1fr}#dock{bottom:7px;gap:4px;padding:6px}#dock button{flex-basis:41px;width:41px;height:41px}header{padding:0 8px}}
</style></head><body>
<header><div id="brand">◈ <b>AWE</b>WEBOS <span class="small muted">· WEB KERNEL</span></div><div class="row"><span id="net" class="small muted">● Local system</span><span id="clock" class="small"></span><button onclick="openApp('settings')" title="Settings">⚙</button></div></header>
<main id="desktop"><div class="icons" id="icons"></div><div class="hero"><h1>YOUR DEVICE.<br><span>YOUR WORLD.</span></h1><p>A local-first web operating environment for the AWE ecosystem.</p><span class="muted small">PWA · Local storage · Offline shell</span></div><div id="windows"></div><nav id="dock"></nav></main><div id="toast" class="toast hidden"></div>
<script>
const apps=[
['files','📁','Files & Storage'],['translate','🌐','Universal Translate'],['browser','🧭','AWE Browser'],['notes','📝','Notes'],['store','🛍️','AWESTORE'],['wallet','◉','ONECOIN Wallet'],['node','🔗','AWENET Node'],['messenger','💬','AWE Messenger'],['studio','⌘','Developer Studio'],['terminal','>_','Terminal'],['monitor','📊','System Monitor'],['settings','⚙️','Settings'],['help','❔','System Guide']
];
const $=id=>document.getElementById(id);let z=10, folder=null, deferredPrompt=null;
let data={notes:'',name:'AWE User',coins:10,messages:[],theme:'aurora',...(JSON.parse(localStorage.getItem('awewebos.v2')||'{}'))};
function save(){try{localStorage.setItem('awewebos.v2',JSON.stringify(data))}catch{toast('Browser storage unavailable or full.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function appInfo(id){return apps.find(a=>a[0]===id)||apps[0]}
function init(){const ids=['files','translate','browser','notes','store','node','messenger','studio','settings'];$('icons').innerHTML=ids.map(id=>{let a=appInfo(id);return '<button class="deskicon" onclick="openApp(&quot;'+id+'&quot;)"><span class="emoji">'+a[1]+'</span>'+a[2]+'</button>'}).join('');$('dock').innerHTML='<button onclick="launcher()" title="App launcher">◈</button>'+['files','browser','translate','notes','messenger','store','terminal','settings','monitor'].map(id=>'<button title="'+appInfo(id)[2]+'" onclick="openApp(&quot;'+id+'&quot;)">'+appInfo(id)[1]+'</button>').join('');setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});window.addEventListener('online',()=>{$('net').textContent='● Online'});window.addEventListener('offline',()=>{$('net').textContent='● Offline'});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});if('launchQueue'in window)window.launchQueue.setConsumer(p=>{if(p.files?.length)toast('Received '+p.files.length+' file(s)')})}
function openApp(id){let old=$('w-'+id);if(old){old.classList.remove('hidden');old.style.zIndex=++z;return}let a=appInfo(id),w=document.createElement('section');w.className='window';w.id='w-'+id;w.style.zIndex=++z;w.innerHTML='<div class="winhead"><b>'+a[1]+' '+a[2]+'</b><div><button onclick="minApp(&quot;'+id+'&quot;)">—</button><button onclick="maxApp(&quot;'+id+'&quot;)">□</button><button onclick="closeApp(&quot;'+id+'&quot;)">×</button></div></div><div class="winbody">'+content(id)+'</div>';$('windows').appendChild(w);drag(w);if(id==='notes')$('notesArea').value=data.notes||'';if(id==='studio')$('code').value=localStorage.getItem('awewebos.code')||'<h1>Hello AWEWEBOS</h1><p>Build something on your device.</p>';if(id==='translate')loadTranslate();if(id==='monitor')monitor();if(id==='files')storageEstimate()}
function closeApp(id){$('w-'+id)?.remove()}function minApp(id){$('w-'+id).classList.add('hidden')}function maxApp(id){$('w-'+id).classList.toggle('max')}
function drag(w){let h=w.querySelector('.winhead'),sx,sy,x,y;h.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('max'))return;sx=e.clientX;sy=e.clientY;let r=w.getBoundingClientRect();x=r.left;y=r.top;w.style.transform='none';w.style.left=x+'px';w.style.top=y+'px';w.style.zIndex=++z;h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!h.hasPointerCapture(e.pointerId))return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,x+e.clientX-sx))+'px';w.style.top=Math.max(44,Math.min(innerHeight-80,y+e.clientY-sy))+'px'});h.addEventListener('pointerup',e=>{try{h.releasePointerCapture(e.pointerId)}catch{}})}
function content(id){switch(id){
case'files':return '<h2>Files & Storage</h2><p>Open a folder explicitly. Browser permissions and capabilities vary.</p><div class="row"><button class="primary" onclick="pickFolder()">📂 Open folder</button><button onclick="exportData()">Export backup</button><button onclick="$(&quot;importFile&quot;).click()">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(this)"></div><div id="folderStatus" class="item">No external folder selected.</div><div id="storage" class="card">Checking origin storage…</div><div id="fileList" class="list"></div><div class="row"><input id="fileName" placeholder="new-file.txt"><button onclick="createFile()">Create text file</button></div>';
case'translate':return '<h2>Universal Translator</h2><p>Google Translate widget can translate this interface into many supported languages.</p><div id="google_translate_element"></div><h3>Translate text</h3><textarea id="sourceText" class="field" rows="5" placeholder="Type or paste text…"></textarea><div class="row"><select id="targetLang" class="field" style="flex:1">'+[['en','English'],['hy','Հայերեն'],['ru','Русский'],['fr','Français'],['de','Deutsch'],['es','Español'],['ar','العربية'],['zh-CN','中文（简体）'],['zh-TW','中文（繁體）'],['hi','हिन्दी'],['ja','日本語'],['ko','한국어'],['pt','Português'],['it','Italiano'],['tr','Türkçe'],['fa','فارسی'],['uk','Українська'],['el','Ελληνικά'],['nl','Nederlands'],['pl','Polski'],['he','עברית'],['ka','ქართული'],['az','Azərbaycanca'],['bn','বাংলা'],['id','Indonesia'],['vi','Tiếng Việt'],['th','ไทย'],['sw','Kiswahili'],['sv','Svenska'],['no','Norsk'],['da','Dansk'],['fi','Suomi'],['cs','Čeština'],['ro','Română'],['hu','Magyar'],['sr','Српски'],['hr','Hrvatski'],['bg','Български'],['sk','Slovenčina'],['sl','Slovenščina'],['ur','اردو'],['ta','தமிழ்'],['te','తెలుగు'],['mr','मराठी'],['ms','Melayu'],['fil','Filipino'],['ca','Català'],['et','Eesti'],['lv','Latviešu'],['lt','Lietuvių']].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select><button class="primary" onclick="translateText()">Translate</button></div><textarea id="translatedText" class="field" rows="5" readonly placeholder="Translation…"></textarea><p class="small muted">Needs internet. Text may be sent to Google; do not translate confidential content. The direct endpoint is unofficial, not a guaranteed public API.</p>';
case'browser':return '<h2>AWE Browser</h2><p>Open a web address or try AWE ecosystem links. Live AWEID resolution needs an AWENET gateway, not configured yet.</p><div class="row"><input id="url" class="field" placeholder="https://example.com or AWEID"><button class="primary" onclick="goURL()">Open ↗</button></div><div class="row"><button onclick="quickURL(&quot;https://github.com/ARARAT33/AWENET&quot;)">AWENET</button><button onclick="quickURL(&quot;https://github.com/ARARAT33/AWE&quot;)">AWE</button><button onclick="quickURL(&quot;https://github.com/ARARAT33/AWEWEBOS&quot;)">AWEWEBOS</button></div><div class="card"><b>Note</b><p>External sites open in a separate tab. Some websites block embedding by design.</p></div>';
case'notes':return '<h2>Local Notes</h2><p>Automatically saved to this browser.</p><textarea id="notesArea" class="field" rows="13" oninput="data.notes=this.value;save()" placeholder="Your notes…"></textarea><button onclick="downloadText(&quot;awe-notes.txt&quot;,data.notes)">Download TXT</button>';
case'store':return '<h2>AWESTORE · On-device app library</h2><p>Install an HTML mini-app from a file on your device. It is stored locally and launched in a sandbox. Only install code you trust.</p><div class="row"><input id="appPackage" type="file" accept=".html,.htm,text/html" class="field"><button class="primary" onclick="installLocalApp()">Install HTML app</button></div><div id="installedApps" class="list"></div><h3>Built-in apps</h3><div class="cards">'+[['translate','🌐','Translator'],['studio','⌘','Developer Studio'],['monitor','📊','System Monitor'],['notes','📝','Notes']].map(a=>'<div class="card"><div class="metric">'+a[1]+'</div><h3>'+a[2]+'</h3><button class="primary" onclick="openApp(&quot;'+a[0]+'&quot;)">Launch</button></div>').join('')+'</div><p class="small muted">Imported apps run with restricted iframe permissions. This local library is not yet a signed, shared global store or payment system.</p>';
case'wallet':return '<h2>ONECOIN Wallet · Demo</h2><div class="card"><div class="muted">Local demo balance</div><div class="metric">'+Number(data.coins||10).toFixed(2)+' ONECOIN</div><span class="small">No monetary value · not a real wallet</span></div><div class="row" style="margin-top:12px"><button class="primary" onclick="data.coins=Number(data.coins||0)+.1;save();closeApp(&quot;wallet&quot;);openApp(&quot;wallet&quot;);toast(&quot;Demo balance updated only&quot;)">Demo reward +0.1</button><button onclick="data.coins=10;save();closeApp(&quot;wallet&quot;);openApp(&quot;wallet&quot;)">Reset</button></div><p>Real ONECOIN requires an audited protocol, secure keys, transaction validation, network consensus and anti-abuse controls. This prototype cannot send/receive funds.</p>';
case'node':return '<h2>AWENET Node</h2><div class="cards"><div class="card"><div class="metric">LOCAL</div><b>Device runtime</b><p>This app runs on your device.</p></div><div class="card"><div class="metric">NOT CONNECTED</div><b>AWENET transport</b><p>No live node endpoint configured.</p></div></div><h3>Contribution preferences (saved locally only)</h3><label>Storage quota GB</label><input class="field" id="quota" type="number" min="0" max="10000" value="'+esc(localStorage.getItem('awe.node.quota')||'5')+'"><label>CPU quota %</label><input class="field" id="cpu" type="range" min="0" max="50" value="'+esc(localStorage.getItem('awe.node.cpu')||'5')+'"><button class="primary" onclick="localStorage.setItem(&quot;awe.node.quota&quot;,$ (&quot;quota&quot;).value);localStorage.setItem(&quot;awe.node.cpu&quot;,$ (&quot;cpu&quot;).value);toast(&quot;Preferences saved; no node started&quot;)">Save</button><p class="small muted">No resource sharing runs. A real node requires a reviewed native service, explicit opt-in, isolation and quotas.</p>';
case'messenger':return '<h2>AWE Messenger · Direct peer connection</h2><p>Connect two browsers directly using WebRTC. Exchange the offer and answer manually (copy/paste) to avoid a hosted signaling server. Both peers need internet/network reachability; some networks require a TURN relay.</p><div class="row"><button class="primary" onclick="p2pCreateOffer()">1. Create offer</button><button onclick="p2pAcceptOffer()">2. Accept offer</button><button onclick="p2pApplyAnswer()">3. Apply answer</button><button onclick="p2pDisconnect()">Disconnect</button></div><label>Connection code (copy to the other device, or paste their reply)</label><textarea id="signalBox" class="field" rows="4" placeholder="Offer/answer JSON appears here…"></textarea><div class="item"><b>Connection status</b><span id="p2pStatus">Not connected</span></div><div class="list" id="messages">'+(data.messages||[]).map(m=>'<div class="item"><div><b>'+esc(m.author)+'</b><br>'+esc(m.text)+'<div class="small muted">'+esc(m.time)+'</div></div></div>').join('')+'</div><div class="row"><input id="message" placeholder="Send direct message…"><button class="primary" onclick="sendMessage()">Send</button></div><p class="small muted">Messages can be sent to the connected peer over an encrypted WebRTC data channel. This is not a full messenger yet: no account discovery, groups, push, voice/video, offline delivery, or guaranteed NAT traversal.</p>';
case'studio':return '<h2>Developer Studio</h2><p>HTML editor with a sandboxed preview. Draft stays local.</p><textarea id="code" class="field" rows="8" spellcheck="false"></textarea><div class="row"><button class="primary" onclick="preview()">Preview</button><button onclick="localStorage.setItem(&quot;awewebos.code&quot;,$ (&quot;code&quot;).value);toast(&quot;Saved locally&quot;)">Save</button><button onclick="downloadText(&quot;awe-project.html&quot;,$ (&quot;code&quot;).value)">Download</button><button onclick="installStudioApp()">Install in AWESTORE</button></div><iframe id="preview" sandbox="allow-scripts" title="HTML preview" style="width:100%;height:200px;background:white;border-radius:10px;margin-top:12px"></iframe>';
case'terminal':return '<h2>Safe Command Console</h2><p>Not an OS shell. Commands run only inside this web app.</p><div class="terminal" id="termOut">AWEWEBOS Shell v2\nType help to see commands.</div><div class="row"><span>user@awewebos:~$</span><input id="cmd" onkeydown="if(event.key===&quot;Enter&quot;)command()" placeholder="help"></div>';
case'monitor':return '<h2>System Monitor</h2><div class="cards"><div class="card"><div class="metric">'+(navigator.hardwareConcurrency||'—')+'</div><div class="muted small">Reported logical CPU cores</div></div><div class="card"><div class="metric">'+(navigator.onLine?'ONLINE':'OFFLINE')+'</div><div class="muted small">Network hint</div></div><div class="card"><div class="metric">'+esc(navigator.language||'—')+'</div><div class="muted small">Browser language</div></div><div class="card"><div class="metric">'+('serviceWorker'in navigator?'YES':'NO')+'</div><div class="muted small">Service worker API</div></div></div><p>Browsers do not expose all hardware telemetry, every monitor, or all disks to ordinary web apps.</p><button onclick="document.documentElement.requestFullscreen().catch(()=>toast(&quot;Fullscreen unavailable&quot;))">Fullscreen</button>';
case'settings':return '<h2>System Settings</h2><div class="cards"><div class="card"><h3>Profile</h3><label>Display name</label><input id="name" class="field" value="'+esc(data.name||'AWE User')+'"><button class="primary" onclick="data.name=$(&quot;name&quot;).value.trim()||&quot;AWE User&quot;;save();toast(&quot;Profile saved&quot;)">Save</button></div><div class="card"><h3>PWA</h3><p>Install as a standalone window. OS startup is configured by the OS, not forced by this app.</p><button class="primary" onclick="installPWA()">Install app</button><button onclick="document.documentElement.requestFullscreen().catch(()=>toast(&quot;Fullscreen unavailable&quot;))">Fullscreen</button></div><div class="card"><h3>Data</h3><button onclick="exportData()">Export backup</button><button onclick="if(confirm(&quot;Clear AWEWEBOS data from this browser?&quot;)){localStorage.removeItem(&quot;awewebos.v2&quot;);location.reload()}">Clear local data</button></div></div><p class="small muted">A normal PWA cannot force boot startup or enumerate every disk/display. These require OS-level support.</p>';
default:return '<h2>About AWEWEBOS</h2><p>AWEWEBOS is a browser-based operating environment foundation, not a bootable OS or a native kernel.</p><div class="list">'+[['Desktop, windows, launcher','Implemented in browser'],['Offline app shell','PWA manifest and service worker'],['Notes and settings','Local browser storage'],['Folder access','Explicit permission; supported browsers only'],['Translation','Google Translate widget; online service'],['AWENET/AWEID/ONECOIN','Integration prototypes; not live services'],['Boot startup/all disks/all displays','Requires OS/native companion']].map(x=>'<div class="item"><b>'+x[0]+'</b><span class="small muted">'+x[1]+'</span></div>').join('')+'</div><p><a href="https://github.com/ARARAT33/AWENET" target="_blank" rel="noopener">AWENET ↗</a> · <a href="https://github.com/ARARAT33/AWE" target="_blank" rel="noopener">AWE ↗</a> · <a href="https://github.com/ARARAT33/AWEWEBOS" target="_blank" rel="noopener">Source ↗</a></p>';
}}
function launcher(){let s=prompt('Open app: '+apps.map(a=>a[0]).join(', '),'translate');if(s&&apps.some(a=>a[0]===s.trim()))openApp(s.trim())}
async function pickFolder(){if(!window.showDirectoryPicker){toast('Folder picker unsupported in this browser. Try desktop Chromium.');return}try{folder=await showDirectoryPicker({mode:'readwrite'});await folder.requestPermission({mode:'readwrite'});$('folderStatus').textContent='Connected for this session: '+folder.name;let html='';for await(const [n,h] of folder.entries())html+='<div class="item"><span>'+esc(n)+'</span><span class="small">'+h.kind+'</span></div>';$('fileList').innerHTML=html;toast('Folder access granted')}catch(e){if(e.name!=='AbortError')toast('Folder permission denied or cancelled')}}
async function createFile(){if(!folder){toast('Open a folder first');return}let n=$('fileName').value.trim();if(!n||/[\\/]/.test(n)){toast('Enter a simple file name');return}try{let h=await folder.getFileHandle(n,{create:true}),w=await h.createWritable();await w.write('Created by AWEWEBOS\n');await w.close();toast('File created');pickFolder()}catch(e){toast('Could not create file')}}
async function storageEstimate(){if(navigator.storage?.estimate){let e=await navigator.storage.estimate();$('storage').textContent='Origin storage used: '+((e.usage||0)/1048576).toFixed(2)+' MB / '+((e.quota||0)/1048576).toFixed(0)+' MB estimated quota'}}
function exportData(){downloadText('awewebos-backup.json',JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),'application/json')}
function importData(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...data,...JSON.parse(r.result)};save();toast('Backup imported; reload to apply all fields')}catch{toast('Invalid backup JSON')}};r.readAsText(f)}
function downloadText(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function goURL(){let u=$('url').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u)){if(!u.includes('.')&&!u.includes('/')){toast('AWEID gateway not configured');return}u='https://'+u}try{let p=new URL(u);if(!['http:','https:'].includes(p.protocol))throw 0;window.open(p.href,'_blank','noopener,noreferrer')}catch{toast('Invalid URL')}}
function quickURL(u){window.open(u,'_blank','noopener,noreferrer')}
function loadTranslate(){if(window.google?.translate?.TranslateElement)return;window.googleTranslateElementInit=()=>{try{new google.translate.TranslateElement({pageLanguage:'hy',autoDisplay:false},'google_translate_element')}catch{}};if(!document.querySelector('[data-translate-script]')){let s=document.createElement('script');s.dataset.translateScript='1';s.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';s.onerror=()=>toast('Google Translate needs internet access');document.head.appendChild(s)}}
async function translateText(){let text=$('sourceText').value.trim(),target=$('targetLang').value;if(!text){toast('Enter text first');return}let out=$('translatedText');out.value='Translating…';try{let r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(text));if(!r.ok)throw Error();let d=await r.json();out.value=(d[0]||[]).map(x=>x[0]||'').join('')}catch{out.value='Translation endpoint unavailable. Use the Google Translate page widget or translate.google.com. The direct endpoint is unofficial.'}}
function sendMessage(){let v=$('message').value.trim();if(!v)return;const m={author:data.name||'AWE User',text:v,time:new Date().toLocaleString()};data.messages.push(m);save();if(dataChannel?.readyState==='open'){try{dataChannel.send(JSON.stringify({type:'chat',author:m.author,text:v}));p2pSetStatus('Connected · message sent')}catch{toast('Could not send over peer connection')}}else toast('Saved locally only — connect to a peer to send');closeApp('messenger');openApp('messenger')}
function preview(){$('preview').srcdoc=$('code').value}
function command(){let c=$('cmd').value.trim(),o=$('termOut');$('cmd').value='';let r={help:'help, clear, date, whoami, apps, status, open <app>, export',date:new Date().toString(),whoami:data.name,apps:apps.map(a=>a[0]+' — '+a[2]).join('\n'),status:'Local browser kernel active; AWENET not connected.'};if(c==='clear')o.textContent='';else if(c.startsWith('open ')){let id=c.slice(5).trim();if(apps.some(a=>a[0]===id)){openApp(id);r='Opening '+id}else r='Unknown app; type apps'}else if(c==='export'){exportData();r='Backup exported'}else r=r[c]||'Unknown command. Type help.';if(c!=='clear')o.textContent+='\n$ '+c+'\n'+r}

let appDbPromise=null, peer=null, dataChannel=null;
function appDB(){if(appDbPromise)return appDbPromise;appDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('awewebos-app-library',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('apps'))req.result.createObjectStore('apps',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return appDbPromise}
async function installLocalApp(){const f=$('appPackage').files?.[0];if(!f){toast('Choose an HTML file first');return}if(f.size>5*1024*1024){toast('For safety, HTML apps are limited to 5 MB');return}const source=await f.text();if(!/<html|<!doctype|<body/i.test(source)){toast('This does not look like an HTML app');return}const record={id:crypto.randomUUID(),name:f.name.replace(/\.(html?|HTML?)$/,''),source,bytes:f.size,installedAt:new Date().toISOString()};try{const db=await appDB();await new Promise((resolve,reject)=>{const tx=db.transaction('apps','readwrite');tx.objectStore('apps').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});toast('Installed on this device');renderInstalledApps()}catch(e){toast('Could not save app: browser storage may be unavailable')}}
async function renderInstalledApps(){const host=$('installedApps');if(!host)return;try{const db=await appDB(),items=await new Promise((resolve,reject)=>{const q=db.transaction('apps').objectStore('apps').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});host.innerHTML=items.length?items.map(a=>'<div class="item"><div><b>'+esc(a.name)+'</b><div class="small muted">'+(a.bytes/1024).toFixed(1)+' KB · stored on this device</div></div><div class="row"><button onclick="launchLocalApp(\''+a.id+'\')">Launch</button><button onclick="removeLocalApp(\''+a.id+'\')">Remove</button></div></div>').join(''):'<div class="item muted">No imported apps yet.</div>'}catch{host.textContent='Local app database unavailable'}}
async function launchLocalApp(id){const db=await appDB(),a=await new Promise((resolve,reject)=>{const q=db.transaction('apps').objectStore('apps').get(id);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(!a)return;const w=document.createElement('section');w.className='window max';w.style.zIndex=++z;w.innerHTML='<div class="winhead"><b>📦 '+esc(a.name)+'</b><button>×</button></div><iframe title="Sandboxed installed app" sandbox="allow-scripts" referrerpolicy="no-referrer" style="border:0;flex:1;width:100%;background:white"></iframe>';$('windows').appendChild(w);w.querySelector('button').onclick=()=>w.remove();w.querySelector('iframe').srcdoc=a.source;drag(w)}
async function removeLocalApp(id){const db=await appDB();await new Promise((resolve,reject)=>{const tx=db.transaction('apps','readwrite');tx.objectStore('apps').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});renderInstalledApps();toast('App removed from this device')}
function p2pSetStatus(s){const e=$('p2pStatus');if(e)e.textContent=s}
function p2pSetupChannel(ch){dataChannel=ch;ch.onopen=()=>p2pSetStatus('Connected · direct peer channel');ch.onclose=()=>p2pSetStatus('Disconnected');ch.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='chat'){data.messages.push({author:m.author||'Peer',text:String(m.text||''),time:new Date().toLocaleString()});save();const box=$('messages');if(box){const d=document.createElement('div');d.className='item';d.textContent=(m.author||'Peer')+': '+m.text;box.appendChild(d)}}}}
async function p2pCreateOffer(){try{peer?.close();peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});p2pSetupChannel(peer.createDataChannel('awe-chat'));const offer=await peer.createOffer();await peer.setLocalDescription(offer);await new Promise(resolve=>{if(peer.iceGatheringState==='complete')return resolve();const timer=setTimeout(resolve,7000);peer.onicegatheringstatechange=()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);resolve()}}});$('signalBox').value=JSON.stringify(peer.localDescription);p2pSetStatus('Offer created · send this code to peer');}catch(e){toast('Could not create offer: '+e.message)}}
async function p2pAcceptOffer(){try{const offer=JSON.parse($('signalBox').value);if(offer.type!=='offer')throw Error('Paste an offer JSON first');peer?.close();peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peer.ondatachannel=e=>p2pSetupChannel(e.channel);await peer.setRemoteDescription(offer);const answer=await peer.createAnswer();await peer.setLocalDescription(answer);await new Promise(resolve=>{if(peer.iceGatheringState==='complete')return resolve();const timer=setTimeout(resolve,7000);peer.onicegatheringstatechange=()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);resolve()}}});$('signalBox').value=JSON.stringify(peer.localDescription);p2pSetStatus('Answer created · send this code back');}catch(e){toast('Could not accept offer: '+e.message)}}
async function p2pApplyAnswer(){try{const answer=JSON.parse($('signalBox').value);if(answer.type!=='answer')throw Error('Paste the answer JSON from the other device');await peer.setRemoteDescription(answer);p2pSetStatus('Answer applied · connecting…')}catch(e){toast('Could not apply answer: '+e.message)}}
function p2pDisconnect(){try{peer?.close()}catch{}peer=null;dataChannel=null;p2pSetStatus('Disconnected')}

async function installStudioApp(){const source=$('code')?.value||'';if(!source.trim()){toast('Write HTML first');return}const name=(prompt('App name','My AWE app')||'').trim();if(!name)return;try{const db=await appDB(),record={id:crypto.randomUUID(),name,source,bytes:new Blob([source]).size,installedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('apps','readwrite');tx.objectStore('apps').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});toast('Installed in AWESTORE');closeApp('store');openApp('store');renderInstalledApps()}catch{toast('Could not install app locally')}}
function monitor(){/* Values are deliberately limited to APIs browsers expose. */}
async function installPWA(){if(deferredPrompt){deferredPrompt.prompt();let r=await deferredPrompt.userChoice;toast(r.outcome==='accepted'?'Install accepted':'Install dismissed');deferredPrompt=null}else toast('Use browser menu → Install app / Add to Home Screen. HTTPS required.')}
init();
